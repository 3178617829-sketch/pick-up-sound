name: CI

# 只做基础门槛检查：前端类型检查（含 DOM 断言守卫、ESM 守卫、Vue SFC 守卫）
# 与 Rust 全工作区编译检查。
#
# 上游完整的质量门（"npm run test:dom" 的 100+ 个 DOM 测试、"verify:dist"、
# "cargo test --workspace"、"node --test"）需要成套的开发环境，在本仓库的
# CI 上跑不完 —— test:dom 会长时间挂住不退出。那些检查请在本地按 AGENTS.md
# 的全量顺序手动跑。这里只留能在几分钟内给出结论的两步。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查与编译
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: 设置 Node.js 22.23.3（最低 22.18，原生类型擦除）
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.3
          cache: npm

      - name: 安装前端开发依赖
        run: npm ci

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      - name: 前端类型检查
        run: npm run typecheck

      - name: Rust 编译检查
        run: cargo check --workspace
